/* Galerie : un mur de pierre claire, les bandeaux l'un après l'autre, sans légende.
   choix assumé : un seul thème de page ; la bascule Nuit éteint le mur et allume les enseignes. */
:root{
  --mur:#D9D6CF;
  --mur-nuit:#060B10;
  --ref:#56616A;
  --ref-nuit:#8995A0;
  --nuit:#0F1E2E;
  --lagune:#1E5F66;
  --mono:"Geist Mono",Menlo,Consolas,monospace;
  --heros:"Heros","TeX Gyre Heros",Helvetica,Arial,sans-serif;
  color-scheme:light;
}
html{-webkit-text-size-adjust:100%;overflow-x:clip;background:var(--mur);transition:background-color .8s ease-out}
body{margin:0;background:var(--mur);color:var(--nuit);font-family:var(--heros);font-size:16px;line-height:24px;overflow-x:clip;transition:background-color .8s ease-out}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--mur);transition:background-color .8s ease-out}
.nuit,.nuit body,.nuit body::before{background:var(--mur-nuit)}
.sprite{position:absolute;width:0;height:0;overflow:hidden}
:focus-visible{outline:2px solid var(--lagune);outline-offset:4px}
.nuit :focus-visible{outline-color:#7CC3C1}

.galerie{max-width:1480px;margin-inline:auto;box-sizing:border-box;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:112px 160px}
@media (min-width:900px){.galerie{padding-left:max(64px,env(safe-area-inset-left,0px));padding-right:max(64px,env(safe-area-inset-right,0px))}}
.b{margin:0;display:grid;gap:14px}
.b+.b{margin-top:clamp(40px,6vw,88px)}
.b.famille{margin-top:clamp(96px,14vw,200px)}
.b:first-child{margin-top:0}
.ouvrir{display:block;width:100%;padding:0;border:0;background:none;cursor:zoom-in;border-radius:2px}
.ph{display:block;margin-inline:auto;max-width:100%}
.ouvrir svg{display:block;width:100%;height:auto;margin-inline:auto;filter:drop-shadow(0 1px 1px rgba(15,30,46,.14)) drop-shadow(0 6px 12px rgba(15,30,46,.09));transition:filter .8s ease-out}
.nuit .ouvrir svg{filter:none}
.ref{margin:0;font-family:var(--mono);font-size:14px;line-height:20px;color:var(--ref);font-variant-numeric:tabular-nums;transition:color .8s ease-out}
.nuit .ref{color:var(--ref-nuit)}

/* Bascule jour / nuit */
.bascule{position:fixed;z-index:20;top:calc(env(safe-area-inset-top,0px) + 16px);right:max(16px,env(safe-area-inset-right,0px));display:flex;background:var(--mur);border:1px solid var(--nuit);border-radius:4px;transition:background-color .8s ease-out,border-color .8s ease-out}
.bascule button{font:inherit;font-size:15px;line-height:20px;height:38px;padding:0 14px;border:0;background:none;color:var(--nuit);cursor:pointer;transition:background-color .25s ease-out,color .25s ease-out}
.bascule button[aria-pressed="true"]{background:var(--nuit);color:var(--mur)}
.nuit .bascule{background:var(--mur-nuit);border-color:#8995A0}
.nuit .bascule button{color:#C9D3D8}
.nuit .bascule button[aria-pressed="true"]{background:#C9D3D8;color:var(--mur-nuit)}

/* Plein cadre */
.cadre{position:fixed;inset:0;z-index:40;background:var(--mur);display:grid;grid-template-columns:auto minmax(0,1fr) auto;grid-template-rows:1fr auto;align-items:center;gap:12px 20px;box-sizing:border-box;padding:calc(env(safe-area-inset-top,0px) + 72px) max(16px,env(safe-area-inset-right,0px)) calc(env(safe-area-inset-bottom,0px) + 28px) max(16px,env(safe-area-inset-left,0px));transition:background-color .8s ease-out}
.nuit .cadre{background:var(--mur-nuit)}
.cadre-fig{margin:0;grid-column:2;min-width:0}
.cadre-fig svg{display:block;width:100%;height:auto;max-height:calc(100vh - 220px);margin-inline:auto}
.cadre .ref{grid-column:2}
.nav{width:48px;height:48px;display:grid;place-items:center;border:1px solid var(--nuit);border-radius:4px;background:none;color:var(--nuit);cursor:pointer}
.nuit .nav{border-color:#8995A0;color:#C9D3D8}
.nav svg{width:20px;height:20px}
.fermer{position:absolute;top:calc(env(safe-area-inset-top,0px) + 16px);left:max(16px,env(safe-area-inset-left,0px))}
@media (max-width:640px){.cadre{grid-template-columns:minmax(0,1fr) minmax(0,1fr);grid-template-rows:1fr auto auto}.cadre-fig,.cadre .ref{grid-column:1/-1}.prec{grid-row:3;justify-self:start}.suiv{grid-row:3;justify-self:end}}

/* Lumière de nuit */
.veil{opacity:0;transition:opacity .8s ease-out}
.lit{opacity:0;transition:opacity .8s ease-out .15s}
.nuit .veil{opacity:.85}
.nuit .veil.doux{opacity:.1}
.nuit .lit{opacity:1}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}

<script>
"use strict";
/* ---------- Typographie française ---------- */
const fr=s=>String(s)
  .replace(/'/g,'’')
  .replace(/(\d) (\d{3})(?!\d)/g,'$1 $2')
  .replace(/(\d) (mm|cm|m²|m|%|K|h)(?![\wÀ-ÿ])/g,'$1 $2')
  .replace(/ ([:;!?»])/g,' $1');
const esc=s=>String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');

/* ---------- Géométrie des fichiers de la charte ---------- */
const W0=4800,H0=800;
const LR=500.47/167.89, ER=285.66/233.19, DR=250.81/15.89, DB=.74;
const NB=.8038, SB=.6713, MB=.6568;          // ligne de base du nom : logo, signature, métiers
const X=h=>.247*h;                            // zone libre
const EMB={cx:117.26,cy:138.82,ro:112.1,g:7.47}; // centre de l'anneau, rayon extérieur, module g (unités de l'emblème)
const C={nuit:'#0F1E2E',lagune:'#1E5F66',soleil:'#F2A33A',pousse:'#4E9E58',lc:'#7CC3C1',pc:'#6FBA5F',ecume:'#E9EFEC',sable:'#EFE6D8',blanc:'#FFFFFF'};
const HEROS="Heros, 'TeX Gyre Heros', Helvetica, Arial, sans-serif", MONO="'Geist Mono', Menlo, Consolas, monospace";

const R=v=>Math.round(v*10)/10;
const rect=(x,y,w,h,fill,a='')=>`<rect x="${R(x)}" y="${R(y)}" width="${R(w)}" height="${R(h)}" fill="${fill}" ${a}/>`;
const use=(id,x,y,w,h,a='')=>`<use href="#${id}" x="${R(x)}" y="${R(y)}" width="${R(w)}" height="${R(h)}" ${a}/>`;
const logo=(c,x,y,h,a)=>use('logo-'+c,x,y,h*LR,h,a);
const sig=(c,x,y,h,a)=>use('sig-'+c,x,y,h*LR,h,a);
const met=(t,c,x,y,h,a)=>use(`met-${t}-${c}`,x,y,h*LR,h,a);
const emb=(c,x,y,h,a)=>use('emb-'+c,x,y,h*ER,h,a);
const devise=(fill,x,y,w)=>use('devise',x,y,w,w/DR,`fill="${fill}"`);
const ctr=(W,w)=>(W-w)/2;
const T=(s,x,y,size,fill,o={})=>`<text x="${R(x)}" y="${R(y)}" font-family="${o.mono?MONO:HEROS}" font-size="${size}" fill="${fill}"${o.anchor?` text-anchor="${o.anchor}"`:''}${o.ls?` letter-spacing="${R(o.ls*size)}"`:''}${o.op?` opacity="${o.op}"`:''}>${esc(fr(s))}</text>`;
const ctx=document.createElement('canvas').getContext('2d');
const tw=(s,size,ls=0)=>{s=fr(s);ctx.font=`${size}px ${HEROS}`;return ctx.measureText(s).width+ls*size*(s.length-1);};
const rng=seed=>()=>{seed|=0;seed=seed+0x6D2B79F5|0;let t=Math.imul(seed^seed>>>15,1|seed);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;};

/* ---------- Matières ---------- */
const grad=(id,stops,dir='x1="0" y1="0" x2="1" y2="1"')=>`<linearGradient id="${id}" ${dir}>${stops.map(([o,c,a])=>`<stop offset="${o}" stop-color="${c}"${a!=null?` stop-opacity="${a}"`:''}/>`).join('')}</linearGradient>`;
const brass=P=>grad(P+'-brass',[[0,'#86662B'],[.2,'#D5B36B'],[.36,'#F1DCA2'],[.52,'#B48C3D'],[.76,'#E0BF7B'],[1,'#7A5B25']]);
const gold=P=>grad(P+'-gold',[[0,'#A27A2B'],[.25,'#E8C772'],[.42,'#FFF0BA'],[.6,'#C99A3E'],[.82,'#F0D388'],[1,'#8F6C28']]);
const inox=P=>grad(P+'-inox',[[0,'#9AA1A6'],[.28,'#E4E7E9'],[.5,'#B2B8BC'],[.74,'#DCE0E2'],[1,'#A1A8AD']],'x1="0" y1="0" x2="1" y2=".35"');
const blurF=(id,std,x=-.25,y=-.7)=>`<filter id="${id}" x="${x*100}%" y="${y*100}%" width="${(1-2*x)*100}%" height="${(1-2*y)*100}%"><feGaussianBlur stdDeviation="${std}"/></filter>`;
const glowDefs=P=>blurF(P+'-ha',14,-.15,-.4)+blurF(P+'-hb',44,-.25,-.8);
const shadowDef=(P,std)=>blurF(P+'-sh',std,-.06,-.2);
const shadow=(P,sym,x,y,w,h,dx,dy,op)=>`<g filter="url(#${P}-sh)" opacity="${op}">${use(sym,x+dx,y+dy,w,h,'fill="#000"')}</g>`;
/* Relief d'une lettre découpée : arête éclairée en haut à gauche */
const relief=(P,{blur=3,scale=3.5,k=.55,exp=18}={})=>`<filter id="${P}-rl" x="-4%" y="-10%" width="108%" height="120%" color-interpolation-filters="sRGB"><feGaussianBlur in="SourceAlpha" stdDeviation="${blur}" result="b"/><feSpecularLighting in="b" surfaceScale="${scale}" specularConstant="1" specularExponent="${exp}" lighting-color="#FFFFFF" result="s"><feDistantLight azimuth="235" elevation="42"/></feSpecularLighting><feComposite in="s" in2="SourceAlpha" operator="in" result="s2"/><feComposite in="SourceGraphic" in2="s2" operator="arithmetic" k1="0" k2="1" k3="${k}" k4="0"/></filter>`;
const RL=P=>`filter="url(#${P}-rl)"`;
/* Surface éclairée : relief de bruit sous une lumière rasante */
const surface=(id,{freq,oct=3,seed=2,scale=1.5,az=235,el=55,color='#FFFFFF',gain=1.22,type='fractalNoise'})=>`<filter id="${id}" x="0" y="0" width="100%" height="100%" color-interpolation-filters="sRGB"><feTurbulence type="${type}" baseFrequency="${freq}" numOctaves="${oct}" seed="${seed}" result="n"/><feDiffuseLighting in="n" surfaceScale="${scale}" diffuseConstant="1" lighting-color="#FFFFFF" result="l"><feDistantLight azimuth="${az}" elevation="${el}"/></feDiffuseLighting><feFlood flood-color="${color}" result="c"/><feComposite in="l" in2="c" operator="arithmetic" k1="${gain}" k2="0" k3="0" k4="0"/></filter>`;
const surf=(id,w,h,a='')=>`<rect width="${w}" height="${h}" filter="url(#${id})" ${a}/>`;
const grain=(id,w,h,op=1)=>surf(id,w,h,`style="mix-blend-mode:multiply" opacity="${op}"`);
const noise=(id,freq,oct,rgb,A,B,seed=3)=>`<filter id="${id}" x="0" y="0" width="100%" height="100%"><feTurbulence type="fractalNoise" baseFrequency="${freq}" numOctaves="${oct}" seed="${seed}" stitchTiles="stitch"/><feColorMatrix type="matrix" values="0 0 0 0 ${rgb[0]} 0 0 0 0 ${rgb[1]} 0 0 0 0 ${rgb[2]} ${A} 0 0 0 ${B}"/></filter>`;
const halo=(P,sym,x,y,w,h,face)=>`<g filter="url(#${P}-hb)" opacity=".95">${use(sym,x,y,w,h,'fill="#FFC27A"')}</g><g filter="url(#${P}-ha)">${use(sym,x,y,w,h,'fill="#FFE6BF"')}</g>${use(sym,x,y,w,h,`fill="${face}"`)}`;
const glow=(P,inner,op=.85)=>`<g filter="url(#${P}-ha)" opacity="${op}">${inner}</g>${inner}`;
const LAMPE=200;
const lampes=(xs,col='#2A3239')=>xs.map(x=>`<g fill="${col}"><rect x="${R(x-6)}" y="-200" width="12" height="104"/><circle cx="${R(x)}" cy="-96" r="13"/><path d="M${R(x-36)},-100h72l40,58h-152z"/></g><rect x="${R(x-70)}" y="-44" width="140" height="7" rx="3.5" fill="#8C8F8C"/>`).join('');

/* Trame de l'emblème : réseau en quinconce de la tuile de 88 px */
function trame(x0,y0,x1,y1,fill,op,{reserve=null,entier=false,k=4.4}={}){
  const p=44*k, ew=285.66*.0518*k, eh=233.19*.0518*k; let s='';
  for(let j=-1; y0+j*p<y1; j++) for(let i=-1; x0+i*p<x1; i++){
    if(((i+j)%2+2)%2) continue;
    const x=x0+14.5*k+i*p, y=y0+15.93*k+j*p;
    if(x+ew<x0||x>x1||y+eh<y0||y>y1) continue;
    if(entier&&(x<x0||x+ew>x1||y<y0||y+eh>y1)) continue;
    if(reserve&&x+ew>reserve[0]&&x<reserve[2]&&y+eh>reserve[1]&&y<reserve[3]) continue;
    s+=use('emb-petit',x,y,ew,eh);
  }
  return `<g fill="${fill}" fill-opacity="${op}">${s}</g>`;
}
const boite=(x,y,w,h,m)=>[x-m,y-m,x+w+m,y+h+m];

/* Tracé de construction de l'emblème, calé sur un logo posé en (lx, ly) à la hauteur lh */
function construction(w,h,lx,ly,lh,{grille,trait,note,epais=3}){
  const e=.72*lh/167.89,g=EMB.g*e,cx=lx+EMB.cx*e,cy=ly+EMB.cy*e,ro=EMB.ro*e,ri=ro-1.5*g,d=`stroke-dasharray="${R(g*1.1)} ${R(g*.8)}"`;
  const L=(x1,y1,x2,y2,c,sw,a='')=>`<line x1="${R(x1)}" y1="${R(y1)}" x2="${R(x2)}" y2="${R(y2)}" stroke="${c}" stroke-width="${sw}" ${a}/>`;
  const P=(a,r)=>[cx+r*Math.cos(a*Math.PI/180),cy+r*Math.sin(a*Math.PI/180)];
  const arc=(r,a0,a1)=>{const[p,q]=P(a0,r),[u,v]=P(a1,r);return `<path d="M${R(p)},${R(q)}A${R(r)},${R(r)} 0 0 1 ${R(u)},${R(v)}" fill="none" stroke="${trait}" stroke-width="${epais}" ${d}/>`;};
  let s='';
  if(grille){for(let x=cx%(5*g);x<w;x+=5*g)s+=L(x,0,x,h,grille,2);for(let y=cy%(5*g);y<h;y+=5*g)s+=L(0,y,w,y,grille,2);}
  s+=L(0,cy,w,cy,trait,epais,d)+L(cx,0,cx,h,trait,epais,d);
  s+=`<circle cx="${R(cx)}" cy="${R(cy)}" r="${R(ro)}" fill="none" stroke="${trait}" stroke-width="${epais}" ${d}/><circle cx="${R(cx)}" cy="${R(cy)}" r="${R(ri)}" fill="none" stroke="${trait}" stroke-width="${epais}" ${d}/>`;
  s+=arc(17*g,-84,-6)+arc(22*g,-84,-6);
  for(const a of [-57.6,-39.6,-21.6]){const[p,q]=P(a,26*g);s+=L(cx,cy,p,q,trait,epais,d);}
  s+=`<circle cx="${R(cx)}" cy="${R(cy)}" r="${R(g*.45)}" fill="${note}"/>`;
  const lab=(t,a,r,anc='start')=>{const[p,q]=P(a,r);return T(t,p,q,R(g*2.6),note,{mono:true,anchor:anc});};
  s+=lab('17 g',-88,17*g+g*.6,'end')+lab('22 g',-88,22*g+g*.6,'end')+lab('18°',-50,24*g)+lab('g',180,ro-.75*g+g*.9,'middle');
  return s;
}

/* Aplats et typographie : la suite des 15, 16, 21, 23 et 26 (numéros 60 et plus, les précédents ne bougent pas) */
const D1='Agir aujourd\'hui,',D2='construire demain',TEL='06 34 56 46 00',CONSEIL='Devis et conseil',MET=['Environnement','Rénovation','Solaire'];
const OR=.618,TR=192;                                   // nombre d'or ; tranche Soleil = 4 % de la largeur
const deux=(x,fs,c,h,o={})=>{const y=h/2-.19*fs;return T(D1,x,y,fs,c,{ls:-.02,...o})+T(D2,x,y+fs*1.1,fs,c,{ls:-.02,...o});};
const contact=(x,nb,fs,cTel,cLab,o={})=>T(CONSEIL,x,nb-fs*.72-60,64,cLab,o)+T(TEL,x,nb,fs,cTel,{ls:.01,...o});
const colonne=(x,yb,fs,c,pas)=>MET.map((m,i)=>T(m,x,yb-(2-i)*pas,fs,c)).join('');

/* Fonds de matière réutilisés */
function piseFond(P,w,h){const r=rng(38290),pal=['#BC9C70','#A68660','#C6A97F','#9E8059','#B29470','#C2A47A'];
  let st='';for(let y=-40,i=0;y<h+40;i++){const t=60+r()*70;st+=rect(-60,y,w+120,t+2,pal[(i*5+(r()*3|0))%6]);y+=t;}
  let pb='';for(let i=0;i<170;i++){const x=r()*w,y=r()*h,rr=5+r()*12;pb+=`<ellipse cx="${R(x)}" cy="${R(y)}" rx="${R(rr*1.3)}" ry="${R(rr)}" fill="${['#8F8A80','#A39D92','#77726A','#B1AB9F'][i%4]}" opacity=".8"/>`;}
  const chaux=`<path d="M-20,64 C900,52 1800,76 2700,60 S4200,70 4820,58" fill="none" stroke="#E4DCCB" stroke-width="13"/><path d="M-20,742 C1100,730 2000,754 3000,738 S4300,748 4820,736" fill="none" stroke="#E4DCCB" stroke-width="13"/><path d="M760,60 L372,742" stroke="#DCD3C1" stroke-width="10"/><path d="M4280,62 L3892,740" stroke="#DCD3C1" stroke-width="10"/>`;
  return{defs:`<filter id="${P}-ond" x="0" y="0" width="100%" height="100%"><feTurbulence type="fractalNoise" baseFrequency="0.0025 0.03" numOctaves="2" seed="6" result="t"/><feDisplacementMap in="SourceGraphic" in2="t" scale="26" xChannelSelector="R" yChannelSelector="G"/></filter>`+surface(P+'-pg',{freq:'0.06',oct:3,scale:2.4,seed:5}),
    base:rect(0,0,w,h,'#B49771')+`<g filter="url(#${P}-ond)">${st}</g>`+pb+chaux+grain(P+'-pg',w,h)};}
function melezeFond(P,x0,x1,h){const pal=['#B7834F','#A9743F','#BE8C59','#A06C3B','#B07B46','#C29463'];let s=rect(x0,0,x1-x0,h,'#2E2318');
  for(let i=0;x0+i*60<x1;i++){const x=x0+i*60+8;s+=rect(x,0,Math.min(44,x1-x),h,pal[(i*7+(i>>2))%6]);}
  return{defs:noise(P+'-gr','0.03 0.0016',3,[.2,.12,.05],1.7,-.72,7),base:s+`<rect x="${x0}" width="${x1-x0}" height="${h}" filter="url(#${P}-gr)" opacity=".6"/>`};}
const pvDefs=P=>{const c=14,cell=`<polygon points="${2+c},2 ${158-c},2 158,${2+c} 158,${158-c} ${158-c},158 ${2+c},158 2,${158-c} 2,${2+c}" fill="url(#${P}-cg)"/>`;
  return grad(P+'-cg',[[0,'#0E1B2C'],[.55,'#132539'],[1,'#0C1726']])+`<pattern id="${P}-pv" width="160" height="160" patternUnits="userSpaceOnUse"><rect width="160" height="160" fill="#04060A"/>${cell}${[42,80,118].map(x=>rect(x-.9,4,1.8,152,'#8794A3','opacity=".4"')).join('')}</pattern>`+grad(P+'-pgl',[[0,'#fff',0],[.3,'#fff',.02],[.45,'#fff',.08],[.6,'#fff',.02],[1,'#fff',0]],'x1="0" y1="0" x2="1" y2=".3"');};
const pvFond=(P,x,w,h)=>rect(x,0,w,h,`url(#${P}-pv)`)+rect(x,0,w,h,`url(#${P}-pgl)`)+`<rect x="${x+12}" y="12" width="${w-24}" height="${h-24}" fill="none" stroke="#0A0C10" stroke-width="24"/>`;

/* ===================== Fonds illustrés : 151 à 200 =====================
   Tout est dessiné en vectoriel, dans la palette de la charte. Le logo garde toujours un ciel ou un aplat calme :
   un masque estompe l'illustration autour de sa zone libre. */
const lisse=pts=>{let d=`M${R(pts[0][0])},${R(pts[0][1])}`;for(let i=1;i<pts.length-1;i++){const[x,y]=pts[i],[x2,y2]=pts[i+1];d+=`Q${R(x)},${R(y)} ${R((x+x2)/2)},${R((y+y2)/2)}`;}const l=pts[pts.length-1];return d+`L${R(l[0])},${R(l[1])}`;};
const anguleux=pts=>pts.map((p,i)=>(i?'L':'M')+R(p[0])+','+R(p[1])).join('');
function onde1D(seed,oct){const r=rng(seed),ph=oct.map(()=>[r()*6.283,r()*6.283]),tot=oct.reduce((s,o)=>s+o[0],0);
  return x=>oct.reduce((s,[a,f,cr],i)=>{const v=Math.sin(x*f+ph[i][0])*(.78+.22*Math.sin(x*f*.29+ph[i][1]));return s+a*(cr?1-2*Math.abs(v):v);},0)/tot;}
const ALPES=[[1,.0011],[.6,.0027,1],[.32,.0068,1],[.14,.017,1]],COLLINES=[[1,.0008],[.45,.0019],[.14,.0048]];
const AUBE=[[0,'#0F1E2E'],[.42,'#163A4E'],[.7,'#2A6B72'],[.84,'#7FA59A'],[.93,'#E2B47A'],[1,'#F2A33A']];
const CREP=[[0,'#0F1E2E'],[.5,'#22405A'],[.78,'#9C7458'],[.92,'#E39A4C'],[1,'#F2A33A']];
const JOUR=[[0,'#DCE7E3'],[1,'#F5F8F6']];
const crete=(w,base,amp,seed,oct,pas=30)=>{const f=onde1D(seed,oct),p=[];for(let x=-80;x<=w+80;x+=pas)p.push([x,base-1.8*amp*f(x)]);return p;};
const fermerPoly=(pts,h,trace)=>trace(pts)+`L${R(pts[pts.length-1][0])},${h+80}L${R(pts[0][0])},${h+80}Z`;
const couche=(w,h,k)=>{k._p=crete(w,k.base,k.amp,k.seed,k.oct||COLLINES,k.pas||30);return `<path d="${fermerPoly(k._p,h,k.vif?anguleux:lisse)}" fill="${k.fill}"${k.op?` opacity="${k.op}"`:''}/>`;};
const solY=(k,x)=>{const p=k._p,pas=k.pas||30,i=Math.max(0,Math.min(p.length-2,Math.floor((x+80)/pas)));const t=(x-p[i][0])/pas;return p[i][1]+(p[i+1][1]-p[i][1])*t;};
const cielDef=(P,stops)=>grad(P+'-ciel',stops,'x1="0" y1="0" x2="0" y2="1"');
const brumeDef=(P,c)=>grad(P+'-bru',[[0,c,0],[.5,c,1],[1,c,0]],'x1="0" y1="0" x2="0" y2="1"');
const brume=(P,w,y,hh,op)=>rect(-80,y-hh/2,w+160,hh,`url(#${P}-bru)`,`opacity="${op}"`);
const soleilDef=P=>`<radialGradient id="${P}-sd"><stop offset="0" stop-color="#FFF4DC"/><stop offset=".6" stop-color="#FFD493"/><stop offset="1" stop-color="#F2A33A"/></radialGradient><radialGradient id="${P}-sx"><stop offset="0" stop-color="#F2A33A" stop-opacity=".5"/><stop offset=".3" stop-color="#F2A33A" stop-opacity=".16"/><stop offset="1" stop-color="#F2A33A" stop-opacity="0"/></radialGradient>`;
const soleilD=(P,x,y,r,halo=5)=>`<circle cx="${R(x)}" cy="${R(y)}" r="${R(r*halo)}" fill="url(#${P}-sx)"/><circle cx="${R(x)}" cy="${R(y)}" r="${R(r)}" fill="url(#${P}-sd)"/>`;
const calmeDef=(P,zones,w,h)=>`<radialGradient id="${P}-cz"><stop offset="0" stop-color="#000"/><stop offset=".55" stop-color="#000"/><stop offset="1" stop-color="#000" stop-opacity="0"/></radialGradient><mask id="${P}-calme" maskUnits="userSpaceOnUse" x="-100" y="-300" width="${w+200}" height="${h+400}"><rect x="-100" y="-300" width="${w+200}" height="${h+400}" fill="#fff"/>${zones.map(([x,y,zw,zh])=>rect(x,y,zw,zh,`url(#${P}-cz)`)).join('')}</mask>`;
const zoneLogo=(lx,ly,lh)=>[lx-260,ly-220,lh*LR+520,lh+440];

const panneau=(x,w,h,c)=>`<svg x="${R(x)}" y="0" width="${R(w)}" height="${h}" viewBox="0 0 ${R(w)} ${h}" overflow="hidden">${c}</svg>`;
function rides(w,y0,y1,seed,c,n=90,opMax=.3){const r=rng(seed);let s='';for(let i=0;i<n;i++){const t=r(),y=y0+(y1-y0)*Math.pow(t,1.5),L=(60+r()*380)*(.35+t),x=r()*w,th=1.5+4.5*t;s+=`<rect x="${R(x)}" y="${R(y)}" width="${R(L)}" height="${R(th)}" rx="${R(th/2)}" fill="${c}" opacity="${R((.06+r()*opMax)*100)/100}"/>`;}return s;}
function reflet(x,y0,y1,seed,c='#F6C27A'){const r=rng(seed);let s='';for(let y=y0+6;y<y1;y+=12+r()*12){const t=(y-y0)/(y1-y0),L=(50+t*300)*(.45+r()*.8);s+=`<rect x="${R(x-L/2+(r()-.5)*50*t)}" y="${R(y)}" width="${R(L)}" height="${R(3+t*5)}" rx="2" fill="${c}" opacity="${R((.9-.55*t)*100)/100}"/>`;}return s;}
function flux(w,{n=34,y0=80,pas=19,A=60,f=.0016,seed=3,c,op=.45,sw=5}){const r=rng(seed),p1=r()*6,p2=r()*6;let s='';for(let i=0;i<n;i++){const pts=[];for(let x=-60;x<=w+60;x+=40)pts.push([x,y0+i*pas+A*Math.sin(x*f+p1+i*.09)+A*.45*Math.sin(x*f*2.3+p2-i*.05)]);s+=`<path d="${lisse(pts)}" fill="none" stroke="${c}" stroke-width="${sw}" opacity="${R(op*(.4+.6*Math.sin(Math.PI*(i+.5)/n))*100)/100}"/>`;}return s;}
function ondes(cx,cy,{n=14,r0=40,pas=64,ry=.32,c,sw=6,op=.8}){let s='';for(let k=0;k<n;k++){const r=r0+k*pas*(1+k*.07);s+=`<ellipse cx="${R(cx)}" cy="${R(cy)}" rx="${R(r)}" ry="${R(r*ry)}" fill="none" stroke="${c}" stroke-width="${R(sw*(1-k/n*.6))}" opacity="${R(op*(1-k/n*.85)*100)/100}"/>`;}return s;}
function lame(x0,x1,yb,ep,A,f,ph,fill){const t1=[],t2=[];for(let x=x0;x<=x1;x+=30){const t=(x-x0)/(x1-x0),tp=Math.pow(Math.sin(Math.PI*t),.7)*1.6,y=yb+1.25*A*Math.sin(x*f+ph);t1.push([x,y-ep*tp/2]);t2.push([x,y+ep*tp/2]);}return `<path d="${lisse(t1)}${lisse(t2.reverse()).replace('M','L')}Z" fill="${fill}"/>`;}
function isolignes(w,h,{seed=5,cell=30,niv=12,c,sw=3,op=.3,k=1}){
  const r=rng(seed),O=[...Array(6)].map((_,i)=>{const a=r()*Math.PI,kk=(.0008+r()*.002)*k;return[Math.cos(a)*kk,Math.sin(a)*kk,r()*6.28,1/Math.pow(i+1,.6)];});
  const F=(x,y)=>O.reduce((s,[kx,ky,p,a])=>s+a*Math.sin(x*kx+y*ky+p),0),nx=Math.ceil(w/cell)+1,ny=Math.ceil(h/cell)+1,G=[];let mn=1e9,mx=-1e9;
  for(let j=0;j<ny;j++){G[j]=[];for(let i=0;i<nx;i++){const v=F(i*cell,j*cell);G[j][i]=v;if(v<mn)mn=v;if(v>mx)mx=v;}}
  let d1='',d2='';
  for(let l=1;l<=niv;l++){const L=mn+(mx-mn)*l/(niv+1);let d='';
    for(let j=0;j<ny-1;j++)for(let i=0;i<nx-1;i++){const a=G[j][i],b=G[j][i+1],cc=G[j+1][i+1],dd=G[j+1][i],id=(a>L?8:0)|(b>L?4:0)|(cc>L?2:0)|(dd>L?1:0);if(!id||id===15)continue;
      const x=i*cell,y=j*cell,q=(p,s)=>(L-p)/(s-p),Tp=[x+cell*q(a,b),y],Rt=[x+cell,y+cell*q(b,cc)],Bo=[x+cell*q(dd,cc),y+cell],Lf=[x,y+cell*q(a,dd)];
      const S={1:[[Lf,Bo]],2:[[Bo,Rt]],3:[[Lf,Rt]],4:[[Tp,Rt]],5:[[Lf,Tp],[Bo,Rt]],6:[[Tp,Bo]],7:[[Lf,Tp]],8:[[Lf,Tp]],9:[[Tp,Bo]],10:[[Lf,Bo],[Tp,Rt]],11:[[Tp,Rt]],12:[[Lf,Rt]],13:[[Bo,Rt]],14:[[Lf,Bo]]}[id];
      for(const[p,s] of S)d+=`M${R(p[0])},${R(p[1])}L${R(s[0])},${R(s[1])}`;}
    if(l%4===0)d2+=d;else d1+=d;}
  return `<path d="${d1}" fill="none" stroke="${c}" stroke-width="${sw}" stroke-linecap="round" opacity="${op}"/><path d="${d2}" fill="none" stroke="${c}" stroke-width="${R(sw*1.8)}" stroke-linecap="round" opacity="${R(Math.min(1,op*1.6)*100)/100}"/>`;}
function feuillage(cx,cy,{n=34,seed=4,ray=380,smin=3,smax=6.5,cols,lueur,ang=[-180,0]}){const r=rng(seed);let s='';for(let i=0;i<n;i++){const a=ang[0]+r()*(ang[1]-ang[0]),d=r()*ray*.35,x=cx+Math.cos(a*Math.PI/180)*d,y=cy+Math.sin(a*Math.PI/180)*d,sc=smin+r()*(smax-smin),rot=a+(r()-.5)*30,c=(lueur&&i===n-4)?lueur:cols[(r()*cols.length)|0];
  s+=`<use href="#feuille" width="92.75" height="29.15" transform="translate(${R(x)} ${R(y)}) rotate(${R(rot)}) scale(${R(sc)}) translate(0 -27)" fill="${c}"/>`;}return s;}
function herbes(x0,x1,base,{n=240,hmin=90,hmax=330,seed=9,cols,lean=90,op=[.5,1]}){const r=rng(seed);let s='';for(let i=0;i<n;i++){const x=x0+r()*(x1-x0),hh=hmin+r()*(hmax-hmin),l=(r()-.5)*2*lean,wb=6+r()*9;
  s+=`<path d="M${R(x-wb/2)},${base}Q${R(x+l*.25)},${R(base-hh*.55)} ${R(x+l)},${R(base-hh)}Q${R(x+l*.25+wb*.35)},${R(base-hh*.5)} ${R(x+wb/2)},${base}Z" fill="${cols[(r()*cols.length)|0]}" opacity="${R((op[0]+r()*(op[1]-op[0]))*100)/100}"/>`;}return s;}
const peuplier=(x,sol,hh,c)=>`<ellipse cx="${R(x)}" cy="${R(sol-hh*.55)}" rx="${R(hh*.11)}" ry="${R(hh*.46)}" fill="${c}"/>`+rect(x-hh*.012,sol-hh*.15,hh*.024,hh*.16,c);
const arbre=(x,sol,r,c)=>`<ellipse cx="${R(x)}" cy="${R(sol-r*1.25)}" rx="${R(r)}" ry="${R(r*.86)}" fill="${c}"/><ellipse cx="${R(x-r*.55)}" cy="${R(sol-r)}" rx="${R(r*.62)}" ry="${R(r*.55)}" fill="${c}"/><ellipse cx="${R(x+r*.6)}" cy="${R(sol-r*1.05)}" rx="${R(r*.58)}" ry="${R(r*.52)}" fill="${c}"/>`+rect(x-r*.07,sol-r*.5,r*.14,r*.5+4,c);
function maison(x,sol,o){const{l,mur,toit,type='long',c,ct=c,pv=0,cpv='#1B3550',cpl='#6E9AB8',fen=[],cf,chem=null,strates=false,allume=false}=o;let s='',lit='';const yM=sol-mur,yT=yM-toit;
  s+=rect(x,yM,l,mur+4,c);
  if(strates)for(let y=yM+26;y<sol;y+=38)s+=rect(x,y,l,3,'#8E7252','opacity=".5"');
  if(type==='pignon')s+=`<path d="M${R(x-22)},${R(yM+2)}L${R(x+l/2)},${R(yT)}L${R(x+l+22)},${R(yM+2)}Z" fill="${ct}"/>`;
  else s+=`<path d="M${R(x-32)},${R(yM+2)}L${R(x+46)},${R(yT)}L${R(x+l-46)},${R(yT)}L${R(x+l+32)},${R(yM+2)}Z" fill="${ct}"/>`;
  if(chem!=null)s+=rect(x+l*chem,yT-50+(type==='pignon'?toit*.45:0),Math.max(18,l*.04),80,ct);
  if(pv&&type!=='pignon'){const x0=x+84,x1=x+l-84,y0=yT+14,y1=yM-12,ph=(y1-y0)/pv,nc=Math.max(2,Math.round((x1-x0)/(ph*1.65))),pw=(x1-x0)/nc;
    for(let i=0;i<pv;i++)for(let j=0;j<nc;j++){const px=x0+j*pw+3,py=y0+i*ph+3;s+=rect(px,py,pw-6,ph-6,cpv)+rect(px,py,pw-6,2.5,cpl,'opacity=".75"');}}
  for(const[fx,fy,fw,fh] of fen){const f=rect(x+fx,yM+fy,fw,fh,allume?'#FFD38E':(cf||'#0A1520'));s+=f;lit+=rect(x+fx,yM+fy,fw,fh,'#FFD38E');}
  return{s,lit};}
const clocher=(x,sol,hh,c)=>rect(x,sol-hh,hh*.22,hh,c)+`<path d="M${R(x-8)},${R(sol-hh)}L${R(x+hh*.11)},${R(sol-hh*1.42)}L${R(x+hh*.22+8)},${R(sol-hh)}Z" fill="${c}"/>`;
function village(x0,sol,{seed=12,n=7,e=1,clocherA=-1,...o}){const r=rng(seed);let s='',lit='',x=x0;
  for(let i=0;i<n;i++){const l=(380+r()*420)*e,mur=(150+r()*110)*e,toit=(110+r()*90)*e,type=r()<.42?'pignon':'long',pv=type==='long'&&r()<.8?(r()<.5?1:2):0,fen=[],nf=Math.max(1,Math.round(l/(170*e)));
    for(let k=0;k<nf;k++)fen.push([(k+.5)*l/nf-17*e,mur*.32,34*e,52*e]);
    const m=maison(x,sol,{l,mur,toit,type,pv,fen,chem:r()<.5?.7:null,...o});s+=m.s;lit+=m.lit;
    if(i===clocherA){s+=clocher(x+l+50*e,sol,540*e,o.c);x+=170*e;}
    x+=l+(30+r()*90)*e;}

/* ===================== Peinture procédurale des fonds illustrés =====================
   Chaque fond est peint dans un canvas (0,5 px par mm), converti en image et posé sous le logo vectoriel.
   Lumière, brume, reflets et relief sont calculés ; le logo garde un ciel calme autour de sa zone libre. */
const ECH=.5;
const peintures=new Map(),images=new Map();
function peinture(cle,w,h,fn,fond){if(!peintures.has(cle))peintures.set(cle,{w,h,fn});return rect(0,0,w,h,fond||C.nuit)+`<image class="peint" data-cle="${cle}" x="0" y="0" width="${w}" height="${h}" preserveAspectRatio="none"/>`;}
const fileP=[];let peintreActif=false;
function peindre(racine,prio=false){const L=[];racine.querySelectorAll('image.peint:not([href])').forEach(im=>{const u=images.get(im.dataset.cle);if(u)im.setAttribute('href',u);else L.push(im);});if(prio)fileP.unshift(...L);else fileP.push(...L);if(!peintreActif)peintreSuivant();}
function poser(cle,u){images.set(cle,u);document.querySelectorAll(`image.peint[data-cle="${cle}"]`).forEach(e=>e.setAttribute('href',u));}
function peintreSuivant(){
  const im=fileP.shift();if(!im){peintreActif=false;return;}peintreActif=true;const cle=im.dataset.cle;
  if(images.has(cle)){im.setAttribute('href',images.get(cle));return setTimeout(peintreSuivant,0);}
  const p=peintures.get(cle);
  try{const c=document.createElement('canvas');c.width=Math.round(p.w*ECH);c.height=Math.round(p.h*ECH);const x=c.getContext('2d');x.scale(ECH,ECH);p.fn(x,c,p.w,p.h);
    if(c.toBlob)c.toBlob(b=>{poser(cle,URL.createObjectURL(b));setTimeout(peintreSuivant,10);},'image/jpeg',.93);
    else{poser(cle,c.toDataURL('image/jpeg',.93));setTimeout(peintreSuivant,10);}
  }catch(e){console.error(cle,e);setTimeout(peintreSuivant,0);}
}

      x.save();x.shadowColor='rgba(0,0,0,.3)';x.shadowBlur=20*ECH;x.shadowOffsetX=10*ECH;x.shadowOffsetY=6*ECH;x.fillStyle=lin(x,X,0,X+900,0,[[0,'#5E9693'],[1,'#4F8A8C']]);x.fillRect(X,sol-330,900,330);x.fillStyle=lin(x,X+380,0,X+1080,0,[[0,'#78A9A6'],[1,'#5E9693']]);x.fillRect(X+380,sol-570,700,250);x.restore();
      const vitre=(a,b,cw,ch)=>{x.fillStyle=lin(x,a,b,a+cw,b+ch,[[0,'#3E7F86'],[.5,'#1E5F66'],[1,'#164A50']]);x.fillRect(a,b,cw,ch);x.fillStyle='rgba(255,255,255,.18)';x.beginPath();x.moveTo(a+cw*.15,b);x.lineTo(a+cw*.35,b);x.lineTo(a+cw*.1,b+ch);x.lineTo(a-cw*.1+cw*0,b+ch);x.closePath();x.fill();};
      vitre(X+60,sol-260,280,200);vitre(X+440,sol-510,560,150);vitre(X+520,sol-250,320,250);
      for(let k=0;k<6;k++){const px=X+420+k*108;x.fillStyle=lin(x,px,sol-628,px+80,sol-570,[[0,'#A9D2E6'],[.5,'#2D6A8A'],[1,'#1E4A66']]);x.beginPath();x.moveTo(px,sol-570);x.lineTo(px+92,sol-570);x.lineTo(px+80,sol-628);x.lineTo(px-12,sol-628);x.closePath();x.fill();}
      pArbre(x,4280,sol,120,{c:'#2B6E73',lum:'#5FA9A8',seed:4,sx:2600});pGrain(x,c,2.5);},C.ecume)+logo('couleur',LG.x,LG.y,LG.h),lit:rect(X+60,sol-260,280,200,'#FFD38E')+rect(X+440,sol-510,560,150,'#FFD38E')+rect(X+520,sol-250,320,250,'#FFD38E')}}});
add({fam:'ill-bati',name:'Panorama, 8 000 mm',w:8000,echelle:true,light:RAS,
  draw:(P,w,h)=>{const dw=1500;return{base:peinture('panorama',w,h,(x,c)=>{scAlpes(x,c,w,h,{sol:[5900,598,76],seeds:[311,317,331,337]});pCalme(x,c,q=>pCiel(q,w,h,CIEL_AUBE),zl());pCalme(x,c,q=>pCiel(q,w,h,CIEL_AUBE),[w-240-dw-260,0,dw+520,380]);})+logo('couleur-sombre',LG.x,LG.y,LG.h)+devise(C.blanc,w-240-dw,150,dw)}}});

B.forEach((b,i)=>b.id=String(i+1).padStart(2,'0'));
/* Retirés à la demande (18 novembre 2026) : bâtiments, forêt, champs 188, herbes, couchers de soleil, puis les cas limites (aubes sur les Alpes, centrale, étang en plein jour, coupe de mur). Les autres gardent leur numéro. */
const RETIRES=new Set(['151','152','153','155','156','159','160','161','162','164','177','179','180','181','182','185','186','187','188','190','191','192','193','194','195','196','197','198','199','200']);
for(let i=B.length-1;i>=0;i--)if(RETIRES.has(B[i].id))B.splice(i,1);
{let f='';for(const b of B){b.debut=b.fam!==f;f=b.fam;}}

/* ---------- Assemblage : jour, voile de nuit, lumières ---------- */
function bandeau(b,P){
  const w=b.w||W0,h=b.h||H0,d=b.draw(P,w,h),L=b.light;
  let defs=d.defs||'',lit=d.lit||'',base=d.base,mask='',cls='veil';
  if(L.type==='rasant'){
    defs+=grad(P+'-rg',[[0,'#1E1E1E'],[.55,'#8A8A8A'],[1,'#CFCFCF']],'x1="0" y1="0" x2="0" y2="1"')+`<mask id="${P}-m" maskUnits="userSpaceOnUse" x="0" y="0" width="${w}" height="${h}"><rect width="${w}" height="${h}" fill="url(#${P}-rg)"/></mask>`;
    mask=` mask="url(#${P}-m)"`;lit=rect(0,0,w,5,'#FFF1D6','opacity=".85"')+lit;
  }
  if(L.type==='spots'){
    const xs=L.at.map(f=>f*w);
    defs+=`<radialGradient id="${P}-sg"><stop offset="0" stop-color="#000"/><stop offset=".5" stop-color="#000" stop-opacity=".62"/><stop offset="1" stop-color="#000" stop-opacity="0"/></radialGradient><mask id="${P}-m" maskUnits="userSpaceOnUse" x="0" y="0" width="${w}" height="${h}"><rect width="${w}" height="${h}" fill="#fff"/>${xs.map(x=>`<ellipse cx="${R(x)}" cy="10" rx="${R(w*.2)}" ry="${R(h*1.15)}" fill="url(#${P}-sg)"/>`).join('')}</mask>`;
    mask=` mask="url(#${P}-m)"`;base+=lampes(xs,L.lampe);
    lit+=xs.map(x=>`<rect x="${R(x-70)}" y="-44" width="140" height="7" rx="3.5" fill="#FFF3D4"/>`).join('');
  }
  if(L.type==='caisson'||L.type==='verre') cls+=' doux';
  const t=L.type==='spots'?LAMPE:0;
  return `<svg viewBox="0 ${-t} ${w} ${h+t}" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="${esc(fr(b.name))}"${(b.fam==='formats'||b.echelle)?` style="width:${R(w/100)}%"`:''}><defs>${defs}</defs><g>${base}</g><rect class="${cls}" width="${w}" height="${h}" fill="#040A11"${mask}/><g class="lit">${lit}</g></svg>`;
}

/* ---------- Galerie et plein cadre ---------- */
function rendre(){
  document.getElementById('galerie').innerHTML=B.map((b,i)=>{const w=b.w||W0,h=b.h||H0,t=b.light.type==='spots'?LAMPE:0,l=(b.fam==='formats'||b.echelle)?R(w/100)+'%':'100%';
    return `<figure class="b${b.debut?' famille':''}" id="b${b.id}"><button type="button" class="ouvrir" data-i="${i}" aria-label="${esc(fr('Agrandir le bandeau '+b.id+', '+b.name))}"><span class="ph" style="width:${l};aspect-ratio:${w}/${h+t}"></span></button><figcaption class="ref">${b.id}</figcaption></figure>`;}).join('');
  /* Dessin progressif : les premiers tout de suite, ceux qui approchent de l'écran en priorité, le reste par petits lots */
  const faits=new Set(),boutons=[...document.querySelectorAll('.ouvrir')];
  const dessiner=(el,prio=false)=>{if(faits.has(el)){if(prio)peindre(el,true);return;}faits.add(el);const b=B[+el.dataset.i];el.innerHTML=bandeau(b,'g'+b.id);peindre(el,prio);};
  boutons.slice(0,6).forEach(dessiner);
  if('IntersectionObserver' in window){const io=new IntersectionObserver(es=>es.forEach(e=>{if(e.isIntersecting){io.unobserve(e.target);dessiner(e.target,true);}}),{rootMargin:'1600px 0px'});boutons.forEach(el=>io.observe(el));}
  let k=0;const lot=()=>{let n=0;while(k<boutons.length&&n<3){if(!faits.has(boutons[k])){dessiner(boutons[k]);n++;}k++;}if(k<boutons.length)setTimeout(lot,60);};setTimeout(lot,400);
}
const cadre=document.getElementById('cadre');let courant=-1,retour=null;
function montrer(i){
  courant=(i+B.length)%B.length;const b=B[courant];
  const fig=document.getElementById('cadre-fig');fig.innerHTML=bandeau(b,'z'+b.id);peindre(fig,true);
  document.getElementById('cadre-ref').textContent=b.id;
}
function ouvrir(i,el){retour=el;montrer(i);cadre.hidden=false;document.documentElement.style.overflow='hidden';document.getElementById('fermer').focus();}
function fermer(){cadre.hidden=true;document.getElementById('cadre-fig').innerHTML='';document.documentElement.style.overflow='';if(retour)retour.focus();}
function mode(m){
  document.documentElement.classList.toggle('nuit',m==='nuit');
  document.querySelectorAll('[data-mode]').forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.mode===m)));
}
document.addEventListener('click',e=>{
  const t=e.target.closest('button');
  if(!t){if(!cadre.hidden&&!e.target.closest('.cadre-fig'))fermer();return;}
  if(t.dataset.mode)mode(t.dataset.mode);
  else if(t.dataset.i)ouvrir(+t.dataset.i,t);
  else if(t.id==='fermer')fermer();
  else if(t.id==='prec')montrer(courant-1);
  else if(t.id==='suiv')montrer(courant+1);
});
document.addEventListener('keydown',e=>{
  if(cadre.hidden)return;
  if(e.key==='Escape')fermer();
  else if(e.key==='ArrowLeft')montrer(courant-1);
  else if(e.key==='ArrowRight')montrer(courant+1);
});
(async()=>{
  try{await Promise.race([Promise.all([document.fonts.load('100px Heros'),document.fonts.load('14px "Geist Mono"')]),new Promise(r=>setTimeout(r,1500))]);}catch(e){}
  rendre();
})();
</script>
